name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Unit tests open no window and need no GTK; the library is installed so the Linux binary can be checked to load it.
      - name: GTK 3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0
      - run: go vet ./...
      # DOCKERDESK_LIVE is unset, so live_test.go skips itself; no Docker daemon is used.
      - run: go test ./...
      - run: go build -o bin/dockerdesk-${{ runner.os }}${{ runner.os == 'Windows' && '.exe' || '' }} .
      - uses: actions/upload-artifact@v7
        with:
          name: dockerdesk-${{ runner.os }}
          path: bin/
          if-no-files-found: error

  # A v* tag publishes a GitHub release with the cross-built binaries (gowt needs no cgo, so one runner builds all).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cross
      - run: gh release create "$GITHUB_REF_NAME" bin/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
